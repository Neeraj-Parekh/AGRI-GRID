<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" class="dgm" style="--d-ink:#1b2620;--d-muted:#5b6a5f;--d-box:#fbfcf8;--d-line:#b9c6b5;--d-note:#f3efe2;--d-pcb:#e9dcc2;--d-hole:#b49a6c;--d-esp:#2a2f33;--d-soil:#8a6a4a;--d-water:#7cc0d6;--d-tube:#dfe3dc;--w-pwr:#d0342c;--w-bat:#e07a10;--w-gnd:#2a2a2a;--w-sig:#7a4fb0;--w-i2c:#1f6fd0;--w-probe:#1f8a5a;--w-uart:#b0458a;--w-v12:#a5161c;" role="img" aria-label="Gateway wiring: ESP32-CAM, SIM800L, bucks, pump"><text x="24.0" y="34.0" class="h1" text-anchor="start">Gateway · ESP32-CAM + SIM800L SMS + 12 V pump</text><text x="24.0" y="56.0" class="ms" text-anchor="start">Runs from your 12 V adapter. The MB USB board links it to the laptop for the data bridge.</text><rect x="24.0" y="96.0" width="160.0" height="90.0" rx="6" class="bx" /><text x="34.0" y="116.0" class="mt" text-anchor="start">12 V adapter</text><text x="34.0" y="132.0" class="ms" text-anchor="start">≥ 2 A</text><circle cx="184.0" cy="144.0" r="3" class="pin"/><text x="176.0" y="148.0" class="pn" text-anchor="end">+12V</text><circle cx="184.0" cy="170.0" r="3" class="pin"/><text x="176.0" y="174.0" class="pn" text-anchor="end">GND</text><rect x="270.0" y="96.0" width="170.0" height="100.0" rx="6" class="bx" /><text x="280.0" y="116.0" class="mt" text-anchor="start">LM2596 #1</text><text x="280.0" y="132.0" class="ms" text-anchor="start">set to 5.0 V first</text><circle cx="270.0" cy="144.0" r="3" class="pin"/><text x="278.0" y="148.0" class="pn" text-anchor="start">IN+</text><circle cx="270.0" cy="170.0" r="3" class="pin"/><text x="278.0" y="174.0" class="pn" text-anchor="start">IN−</text><circle cx="440.0" cy="144.0" r="3" class="pin"/><text x="432.0" y="148.0" class="pn" text-anchor="end">OUT+</text><circle cx="440.0" cy="170.0" r="3" class="pin"/><text x="432.0" y="174.0" class="pn" text-anchor="end">OUT−</text><rect x="270.0" y="236.0" width="170.0" height="100.0" rx="6" class="bx" /><text x="280.0" y="256.0" class="mt" text-anchor="start">LM2596 #2</text><text x="280.0" y="272.0" class="ms" text-anchor="start">set to 4.0 V first</text><circle cx="270.0" cy="284.0" r="3" class="pin"/><text x="278.0" y="288.0" class="pn" text-anchor="start">IN+</text><circle cx="270.0" cy="310.0" r="3" class="pin"/><text x="278.0" y="314.0" class="pn" text-anchor="start">IN−</text><circle cx="440.0" cy="284.0" r="3" class="pin"/><text x="432.0" y="288.0" class="pn" text-anchor="end">OUT+</text><circle cx="440.0" cy="310.0" r="3" class="pin"/><text x="432.0" y="314.0" class="pn" text-anchor="end">OUT−</text><path d="M184.0 144.0 L236.0 144.0 L236.0 518.0" fill="none" stroke="var(--w-v12)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M236.0 144.0 L270.0 144.0" fill="none" stroke="var(--w-v12)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M236.0 284.0 L270.0 284.0" fill="none" stroke="var(--w-v12)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="236.0" cy="144.0" r="3.2" fill="var(--w-v12)"/><circle cx="236.0" cy="284.0" r="3.2" fill="var(--w-v12)"/><path d="M184.0 170.0 L220.0 170.0 L220.0 310.0 L270.0 310.0" fill="none" stroke="var(--w-gnd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M220.0 170.0 L270.0 170.0" fill="none" stroke="var(--w-gnd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="220.0" cy="170.0" r="3.2" fill="var(--w-gnd)"/><rect x="560.0" y="90.0" width="200.0" height="260.0" rx="6" class="bx" /><text x="570.0" y="110.0" class="mt" text-anchor="start">ESP32-CAM</text><text x="570.0" y="126.0" class="ms" text-anchor="start">on MB USB board</text><circle cx="560.0" cy="138.0" r="3" class="pin"/><text x="568.0" y="142.0" class="pn" text-anchor="start">5V</text><circle cx="560.0" cy="162.0" r="3" class="pin"/><text x="568.0" y="166.0" class="pn" text-anchor="start">GND</text><circle cx="560.0" cy="186.0" r="3" class="pin"/><text x="568.0" y="190.0" class="pn" text-anchor="start">IO12</text><circle cx="560.0" cy="210.0" r="3" class="pin"/><text x="568.0" y="214.0" class="pn" text-anchor="start">IO13</text><circle cx="560.0" cy="234.0" r="3" class="pin"/><text x="568.0" y="238.0" class="pn" text-anchor="start">IO15</text><circle cx="560.0" cy="258.0" r="3" class="pin"/><text x="568.0" y="262.0" class="pn" text-anchor="start">IO14</text><circle cx="560.0" cy="282.0" r="3" class="pin"/><text x="568.0" y="286.0" class="pn" text-anchor="start">IO2</text><circle cx="560.0" cy="306.0" r="3" class="pin"/><text x="568.0" y="310.0" class="pn" text-anchor="start">IO4</text><circle cx="760.0" cy="138.0" r="3" class="pin"/><text x="752.0" y="142.0" class="pn" text-anchor="end">3V3</text><circle cx="760.0" cy="162.0" r="3" class="pin"/><text x="752.0" y="166.0" class="pn" text-anchor="end">IO16</text><circle cx="760.0" cy="186.0" r="3" class="pin"/><text x="752.0" y="190.0" class="pn" text-anchor="end">IO0</text><circle cx="760.0" cy="210.0" r="3" class="pin"/><text x="752.0" y="214.0" class="pn" text-anchor="end">GND</text><circle cx="760.0" cy="234.0" r="3" class="pin"/><text x="752.0" y="238.0" class="pn" text-anchor="end">VCC</text><circle cx="760.0" cy="258.0" r="3" class="pin"/><text x="752.0" y="262.0" class="pn" text-anchor="end">U0R</text><circle cx="760.0" cy="282.0" r="3" class="pin"/><text x="752.0" y="286.0" class="pn" text-anchor="end">U0T</text><circle cx="760.0" cy="306.0" r="3" class="pin"/><text x="752.0" y="310.0" class="pn" text-anchor="end">GND</text><path d="M440.0 144.0 L500.0 144.0 L500.0 138.0 L560.0 138.0" fill="none" stroke="var(--w-pwr)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M440.0 170.0 L454.0 170.0" fill="none" stroke="var(--w-gnd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="454.0" y="162.0" width="27.8" height="16" rx="8" fill="none" stroke="var(--w-gnd)" stroke-width="1.4"/><text x="467.9" y="174.0" class="nl" text-anchor="middle" style="fill:var(--w-gnd)">GND</text><path d="M560.0 162.0 L546.0 162.0" fill="none" stroke="var(--w-gnd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="518.2" y="154.0" width="27.8" height="16" rx="8" fill="none" stroke="var(--w-gnd)" stroke-width="1.4"/><text x="532.1" y="166.0" class="nl" text-anchor="middle" style="fill:var(--w-gnd)">GND</text><path d="M440.0 284.0 L454.0 284.0" fill="none" stroke="var(--w-bat)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="454.0" y="276.0" width="27.8" height="16" rx="8" fill="none" stroke="var(--w-bat)" stroke-width="1.4"/><text x="467.9" y="288.0" class="nl" text-anchor="middle" style="fill:var(--w-bat)">4V0</text><path d="M440.0 310.0 L454.0 310.0" fill="none" stroke="var(--w-gnd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="454.0" y="302.0" width="27.8" height="16" rx="8" fill="none" stroke="var(--w-gnd)" stroke-width="1.4"/><text x="467.9" y="314.0" class="nl" text-anchor="middle" style="fill:var(--w-gnd)">GND</text><rect x="880.0" y="90.0" width="200.0" height="200.0" rx="6" class="bx" /><text x="890.0" y="110.0" class="mt" text-anchor="start">SIM800L</text><text x="890.0" y="126.0" class="ms" text-anchor="start">2G · antenna fitted</text><circle cx="880.0" cy="138.0" r="3" class="pin"/><text x="888.0" y="142.0" class="pn" text-anchor="start">VCC</text><circle cx="880.0" cy="166.0" r="3" class="pin"/><text x="888.0" y="170.0" class="pn" text-anchor="start">GND</text><circle cx="880.0" cy="194.0" r="3" class="pin"/><text x="888.0" y="198.0" class="pn" text-anchor="start">RST</text><circle cx="880.0" cy="222.0" r="3" class="pin"/><text x="888.0" y="226.0" class="pn" text-anchor="start">TXD</text><circle cx="880.0" cy="250.0" r="3" class="pin"/><text x="888.0" y="254.0" class="pn" text-anchor="start">RXD</text><path d="M880.0 138.0 L866.0 138.0" fill="none" stroke="var(--w-bat)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="838.2" y="130.0" width="27.8" height="16" rx="8" fill="none" stroke="var(--w-bat)" stroke-width="1.4"/><text x="852.1" y="142.0" class="nl" text-anchor="middle" style="fill:var(--w-bat)">4V0</text><path d="M880.0 166.0 L866.0 166.0" fill="none" stroke="var(--w-gnd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="838.2" y="158.0" width="27.8" height="16" rx="8" fill="none" stroke="var(--w-gnd)" stroke-width="1.4"/><text x="852.1" y="170.0" class="nl" text-anchor="middle" style="fill:var(--w-gnd)">GND</text><path d="M880.0 222.0 L866.0 222.0" fill="none" stroke="var(--w-uart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="831.6" y="214.0" width="34.4" height="16" rx="8" fill="none" stroke="var(--w-uart)" stroke-width="1.4"/><text x="848.8" y="226.0" class="nl" text-anchor="middle" style="fill:var(--w-uart)">IO14</text><path d="M880.0 250.0 L860.0 250.0 L860.0 390.0" fill="none" stroke="var(--w-uart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="860.0" cy="390.0" r="3.2" fill="var(--w-uart)"/><path d="M860.0 390.0 L804.0 390.0" fill="none" stroke="var(--w-uart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M836.0 390.0 L780.0 390.0" fill="none" stroke="var(--w-uart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="804.0" y="384.0" width="32.0" height="12.0" rx="2" class="rs" /><text x="820.0" y="380.0" class="sm" text-anchor="middle">1 kΩ</text><path d="M780.0 390.0 L766.0 390.0" fill="none" stroke="var(--w-uart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="731.6" y="382.0" width="34.4" height="16" rx="8" fill="none" stroke="var(--w-uart)" stroke-width="1.4"/><text x="748.8" y="394.0" class="nl" text-anchor="middle" style="fill:var(--w-uart)">IO15</text><path d="M860.0 390.0 L860.0 409.0" fill="none" stroke="var(--w-uart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M860.0 441.0 L860.0 460.0" fill="none" stroke="var(--w-uart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="854.0" y="409.0" width="12.0" height="32.0" rx="2" class="rs" /><text x="870.0" y="429.0" class="sm" text-anchor="start">2 kΩ</text><path d="M860.0 460.0 L860.0 468.0" fill="none" stroke="var(--w-gnd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M851.0 468.0 L869.0 468.0" fill="none" stroke="var(--w-gnd)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M854.0 471.5 L866.0 471.5" fill="none" stroke="var(--w-gnd)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M857.0 475.0 L863.0 475.0" fill="none" stroke="var(--w-gnd)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="880.0" y="312.0" class="sm" text-anchor="start">1000 µF across VCC and GND,</text><text x="880.0" y="328.0" class="sm" text-anchor="start">right at the module</text><text x="600.0" y="446.0" class="sm" text-anchor="start">IO15 (TX) → 1k/2k → SIM RXD (≈ 2.2 V)</text><path d="M560.0 258.0 L546.0 258.0" fill="none" stroke="var(--w-uart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="511.6" y="250.0" width="34.4" height="16" rx="8" fill="none" stroke="var(--w-uart)" stroke-width="1.4"/><text x="528.8" y="262.0" class="nl" text-anchor="middle" style="fill:var(--w-uart)">IO14</text><path d="M560.0 234.0 L546.0 234.0" fill="none" stroke="var(--w-uart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="511.6" y="226.0" width="34.4" height="16" rx="8" fill="none" stroke="var(--w-uart)" stroke-width="1.4"/><text x="528.8" y="238.0" class="nl" text-anchor="middle" style="fill:var(--w-uart)">IO15</text><text x="560.0" y="372.0" class="sm" text-anchor="start">SIM TXD → IO14 (RX)</text><rect x="260.0" y="470.0" width="160.0" height="130.0" rx="6" class="bx" /><text x="270.0" y="490.0" class="mt" text-anchor="start">Relay module</text><text x="270.0" y="506.0" class="ms" text-anchor="start">or logic-level MOSFET</text><circle cx="260.0" cy="518.0" r="3" class="pin"/><text x="268.0" y="522.0" class="pn" text-anchor="start">COM</text><circle cx="260.0" cy="544.0" r="3" class="pin"/><text x="268.0" y="548.0" class="pn" text-anchor="start">NO</text><circle cx="420.0" cy="518.0" r="3" class="pin"/><text x="412.0" y="522.0" class="pn" text-anchor="end">IN</text><circle cx="420.0" cy="544.0" r="3" class="pin"/><text x="412.0" y="548.0" class="pn" text-anchor="end">VCC</text><circle cx="420.0" cy="570.0" r="3" class="pin"/><text x="412.0" y="574.0" class="pn" text-anchor="end">GND</text><path d="M560.0 210.0 L480.0 210.0 L480.0 518.0 L420.0 518.0" fill="none" stroke="var(--w-sig)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="522.0" y="480.0" class="sm" text-anchor="start">IO13 → relay IN</text><path d="M420.0 544.0 L434.0 544.0" fill="none" stroke="var(--w-pwr)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="434.0" y="536.0" width="21.2" height="16" rx="8" fill="none" stroke="var(--w-pwr)" stroke-width="1.4"/><text x="444.6" y="548.0" class="nl" text-anchor="middle" style="fill:var(--w-pwr)">5V</text><path d="M420.0 570.0 L434.0 570.0" fill="none" stroke="var(--w-gnd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="434.0" y="562.0" width="27.8" height="16" rx="8" fill="none" stroke="var(--w-gnd)" stroke-width="1.4"/><text x="447.9" y="574.0" class="nl" text-anchor="middle" style="fill:var(--w-gnd)">GND</text><path d="M236.0 518.0 L260.0 518.0" fill="none" stroke="var(--w-v12)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="260.0" y="640.0" width="160.0" height="90.0" rx="6" class="bx" /><text x="270.0" y="660.0" class="mt" text-anchor="start">12 V pump</text><text x="270.0" y="676.0" class="ms" text-anchor="start">1N4007 across it</text><circle cx="260.0" cy="692.0" r="3" class="pin"/><text x="268.0" y="696.0" class="pn" text-anchor="start">+</text><circle cx="260.0" cy="718.0" r="3" class="pin"/><text x="268.0" y="722.0" class="pn" text-anchor="start">−</text><path d="M260.0 544.0 L246.0 544.0 L246.0 692.0 L260.0 692.0" fill="none" stroke="var(--w-v12)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M260.0 718.0 L246.0 718.0" fill="none" stroke="var(--w-gnd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="218.2" y="710.0" width="27.8" height="16" rx="8" fill="none" stroke="var(--w-gnd)" stroke-width="1.4"/><text x="232.1" y="722.0" class="nl" text-anchor="middle" style="fill:var(--w-gnd)">GND</text><text x="470.0" y="670.0" class="sm" text-anchor="start">Diode band (cathode) to the pump&#x27;s + lead.</text><text x="470.0" y="688.0" class="sm" text-anchor="start">If the relay chatters on 3.3 V logic, drive it</text><text x="470.0" y="706.0" class="sm" text-anchor="start">through an NPN transistor or use an IRLZ44N.</text><rect x="600.0" y="500.0" width="470.0" height="116.0" rx="8" class="nt" /><text x="610.0" y="520.0" class="sm" text-anchor="start">SIM800L is 2G only: use an Airtel, Vi or BSNL SIM.</text><text x="610.0" y="537.0" class="sm" text-anchor="start">Jio is 4G-only and will not register.</text><text x="610.0" y="554.0" class="sm" text-anchor="start">It pulls 2 A bursts: never power it from 3.3 V or 5 V.</text><text x="610.0" y="571.0" class="sm" text-anchor="start">Set both buck outputs with a multimeter BEFORE</text><text x="610.0" y="588.0" class="sm" text-anchor="start">connecting anything to them.</text><text x="610.0" y="605.0" class="sm" text-anchor="start">U0R / U0T are taken by the MB USB board.</text><style>
.dgm{font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;width:100%;height:auto}
.dgm .h1{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;font-size:22px;font-weight:700;fill:var(--d-ink)}
.dgm .h2{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--d-ink)}
.dgm .mt{font-size:14px;font-weight:700;fill:var(--d-ink)}
.dgm .ms{font-size:12px;fill:var(--d-muted)}
.dgm .pn{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;fill:var(--d-ink)}
.dgm .nl{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;font-weight:600}
.dgm .sm{font-size:11.5px;fill:var(--d-muted)}
.dgm .bd{font-size:13px;fill:var(--d-ink)}
.dgm .lbl{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600;fill:var(--d-ink)}
.dgm .tiny{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px;fill:var(--d-ink)}
.dgm .pl{font-size:12px;font-weight:700;fill:var(--d-ink)}
.dgm .bx{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.4}
.dgm .hl{stroke:var(--w-probe);stroke-width:2.2}
.dgm .nt{fill:var(--d-note);stroke:var(--d-line)}
.dgm .rs{fill:var(--d-box);stroke:var(--d-ink);stroke-width:1.4}
.dgm .pin{fill:var(--d-box);stroke:var(--d-ink);stroke-width:1.4}
.dgm .pcb{fill:var(--d-pcb);stroke:var(--d-line)}
.dgm .hole{fill:var(--d-hole)}
.dgm .esp{fill:var(--d-esp);stroke:var(--d-line);opacity:.9}
.dgm .pbx{fill:var(--d-box);stroke:var(--d-ink);stroke-width:1.2;opacity:.92}
.dgm .hdr{fill:#222;stroke:#555}
.dgm .hdr2{fill:var(--w-probe);opacity:.8}
.dgm .soil{fill:var(--d-soil)}
.dgm .water{fill:var(--d-water)}
.dgm .tube{fill:var(--d-tube);stroke:var(--d-ink);stroke-width:1.2}
.dgm .cap{fill:var(--d-ink);opacity:.8}
.dgm .es{fill:#c8742c}
.dgm .eg{fill:#8a5a2b}
.dgm .ds{fill:#333}
.dgm .ff{fill:none;stroke:var(--w-probe);stroke-width:1;stroke-dasharray:2 2;opacity:.8}
</style></svg>