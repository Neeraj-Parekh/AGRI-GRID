<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="dgm" style="--d-ink:#1b2620;--d-muted:#5b6a5f;--d-box:#fbfcf8;--d-line:#b9c6b5;--d-note:#f3efe2;--d-pcb:#e9dcc2;--d-hole:#b49a6c;--d-esp:#2a2f33;--d-soil:#8a6a4a;--d-water:#7cc0d6;--d-tube:#dfe3dc;--w-pwr:#d0342c;--w-bat:#e07a10;--w-gnd:#2a2a2a;--w-sig:#7a4fb0;--w-i2c:#1f6fd0;--w-probe:#1f8a5a;--w-uart:#b0458a;--w-v12:#a5161c;" role="img" aria-label="System diagram: ESP-NOW nodes, gateway, SMS, backend, SAR"><text x="24.0" y="34.0" class="h1" text-anchor="start">AGRI-GRID prototype · how data moves</text><rect x="24.0" y="80.0" width="230.0" height="76.0" rx="6" class="bx" /><text x="40.0" y="106.0" class="mt" text-anchor="start">A1 · Hero probe node</text><text x="40.0" y="126.0" class="ms" text-anchor="start">ESP32 · 6-electrode probe</text><text x="40.0" y="144.0" class="sm" text-anchor="start">18650 · deep sleep · seq + CRC</text><path d="M254.0 118.0 L420.0 290.0" fill="none" stroke="var(--w-sig)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="24.0" y="180.0" width="230.0" height="76.0" rx="6" class="bx" /><text x="40.0" y="206.0" class="mt" text-anchor="start">B2 · Field node</text><text x="40.0" y="226.0" class="ms" text-anchor="start">NodeMCU · mini probe</text><text x="40.0" y="244.0" class="sm" text-anchor="start">18650 · deep sleep · seq + CRC</text><path d="M254.0 218.0 L420.0 290.0" fill="none" stroke="var(--w-sig)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="24.0" y="280.0" width="230.0" height="76.0" rx="6" class="bx" /><text x="40.0" y="306.0" class="mt" text-anchor="start">C3 · Field node</text><text x="40.0" y="326.0" class="ms" text-anchor="start">NodeMCU · mini probe</text><text x="40.0" y="344.0" class="sm" text-anchor="start">18650 · deep sleep · seq + CRC</text><path d="M254.0 318.0 L420.0 290.0" fill="none" stroke="var(--w-sig)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="24.0" y="380.0" width="230.0" height="76.0" rx="6" class="bx" /><text x="40.0" y="406.0" class="mt" text-anchor="start">D4 · Field node</text><text x="40.0" y="426.0" class="ms" text-anchor="start">NodeMCU · mini probe + DHT11</text><text x="40.0" y="444.0" class="sm" text-anchor="start">18650 · deep sleep · seq + CRC</text><path d="M254.0 418.0 L420.0 290.0" fill="none" stroke="var(--w-sig)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="270.0" y="70.0" class="lbl" text-anchor="start">ESP-NOW · 2.4 GHz</text><text x="270.0" y="86.0" class="sm" text-anchor="start">no router · ~100–200 m open air</text><rect x="420.0" y="220.0" width="230.0" height="150.0" rx="6" class="bx hl" /><text x="436.0" y="246.0" class="mt" text-anchor="start">Gateway · ESP32-CAM</text><text x="436.0" y="266.0" class="ms" text-anchor="start">receives, stamps RSSI, dedupes</text><text x="436.0" y="290.0" class="sm" text-anchor="start">+ SIM800L → SMS alerts</text><text x="436.0" y="308.0" class="sm" text-anchor="start">+ pump relay (12 V)</text><text x="436.0" y="326.0" class="sm" text-anchor="start">+ optional gauge photo</text><text x="436.0" y="352.0" class="sm" text-anchor="start">12 V adapter → 5 V and 4.0 V bucks</text><rect x="720.0" y="90.0" width="200.0" height="70.0" rx="6" class="bx" /><text x="736.0" y="116.0" class="mt" text-anchor="start">Farmer&#x27;s phone</text><text x="736.0" y="136.0" class="sm" text-anchor="start">SMS: “A1 −15 cm: irrigate”</text><path d="M650.0 250.0 L720.0 125.0" fill="none" stroke="var(--w-uart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="640.0" y="180.0" class="lbl" text-anchor="start">2G SMS</text><rect x="720.0" y="220.0" width="200.0" height="70.0" rx="6" class="bx" /><text x="736.0" y="246.0" class="mt" text-anchor="start">Laptop · bridge.py</text><text x="736.0" y="266.0" class="sm" text-anchor="start">USB serial → HTTP POST</text><path d="M650.0 300.0 L720.0 255.0" fill="none" stroke="var(--w-sig)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="720.0" y="320.0" width="200.0" height="70.0" rx="6" class="bx" /><text x="736.0" y="346.0" class="mt" text-anchor="start">FastAPI /agri/ingest</text><text x="736.0" y="366.0" class="sm" text-anchor="start">your existing backend</text><path d="M820.0 290.0 L820.0 320.0" fill="none" stroke="var(--w-sig)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="720.0" y="420.0" width="200.0" height="70.0" rx="6" class="bx" /><text x="736.0" y="446.0" class="mt" text-anchor="start">React dashboard</text><text x="736.0" y="466.0" class="sm" text-anchor="start">map · AWD timeline · evidence</text><path d="M820.0 390.0 L820.0 420.0" fill="none" stroke="var(--w-sig)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="950.0" y="320.0" width="130.0" height="70.0" rx="6" class="bx" /><text x="962.0" y="346.0" class="mt" text-anchor="start">Sentinel-1 SAR</text><text x="962.0" y="366.0" class="sm" text-anchor="start">your model</text><path d="M950.0 355.0 L920.0 355.0" fill="none" stroke="var(--w-probe)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="930.0" y="410.0" class="lbl" text-anchor="middle">ground ↔ space</text><rect x="420.0" y="420.0" width="230.0" height="70.0" rx="6" class="bx" /><text x="436.0" y="446.0" class="mt" text-anchor="start">12 V pump → mini paddy</text><text x="436.0" y="466.0" class="sm" text-anchor="start">closes the loop on the table</text><path d="M535.0 370.0 L535.0 420.0" fill="none" stroke="var(--w-v12)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="24.0" y="510.0" width="560.0" height="48.0" rx="8" class="nt" /><text x="34.0" y="530.0" class="sm" text-anchor="start">Field version: replace ESP-NOW with LoRa SX1262 at 865–867 MHz.</text><text x="34.0" y="547.0" class="sm" text-anchor="start">Same packet, same backend; only the radio file changes.</text><style>
.dgm{font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;width:100%;height:auto}
