<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" class="dgm" style="--d-ink:#1b2620;--d-muted:#5b6a5f;--d-box:#fbfcf8;--d-line:#b9c6b5;--d-note:#f3efe2;--d-pcb:#e9dcc2;--d-hole:#b49a6c;--d-esp:#2a2f33;--d-soil:#8a6a4a;--d-water:#7cc0d6;--d-tube:#dfe3dc;--w-pwr:#d0342c;--w-bat:#e07a10;--w-gnd:#2a2a2a;--w-sig:#7a4fb0;--w-i2c:#1f6fd0;--w-probe:#1f8a5a;--w-uart:#b0458a;--w-v12:#a5161c;" role="img" aria-label="Dielectric profile probe: electrode layout and dimensions"><text x="24.0" y="34.0" class="h1" text-anchor="start">Dielectric profile probe · PETG, clamshell print</text><text x="24.0" y="56.0" class="ms" text-anchor="start">Copper tape on the INSIDE wall. The 1.6 mm PETG wall is the insulator: no metal touches soil or water.</text><rect x="80" y="376.0" width="260" height="432.0" class="soil"/><rect x="80" y="268.0" width="260" height="108.0" class="water"/><text x="84.0" y="262.0" class="sm" text-anchor="start">standing water</text><text x="84.0" y="394.0" class="pn" text-anchor="start" style="fill:#f4efe6">soil 0</text><path d="M237.5 124.0 L282.5 124.0 L282.5 754.0 L237.5 754.0 Z" class="tube"/><path d="M237.5 754.0 L282.5 754.0 L260.0 790.0 Z" class="tube"/><rect x="229.5" y="94.0" width="61.0" height="34.0" class="cap"/><text x="260.0" y="86.0" class="sm" text-anchor="middle">cap: EREF pad + cable gland</text><rect x="240.4" y="397.6" width="39.2" height="7.2" class="eg"/><rect x="240.4" y="412.0" width="39.2" height="18.0" class="es"/><path d="M286.5 421.0 L342.5 421.0" fill="none" stroke="var(--w-probe)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="348.5" y="425.0" class="pn" text-anchor="start">E1 · 0–5 cm · C-band SAR depth</text><rect x="240.4" y="437.2" width="39.2" height="7.2" class="eg"/><path d="M282.5 401.2 A 9.9 11.9 0 0 1 282.5 421.0" class="ff"/><path d="M237.5 401.2 A 9.9 11.9 0 0 0 237.5 421.0" class="ff"/><path d="M282.5 401.2 A 14.4 17.3 0 0 1 282.5 421.0" class="ff"/><path d="M237.5 401.2 A 14.4 17.3 0 0 0 237.5 421.0" class="ff"/><rect x="240.4" y="487.6" width="39.2" height="7.2" class="eg"/><rect x="240.4" y="502.0" width="39.2" height="18.0" class="es"/><path d="M286.5 511.0 L342.5 511.0" fill="none" stroke="var(--w-probe)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="348.5" y="515.0" class="pn" text-anchor="start">E2 · 5–10 cm</text><rect x="240.4" y="527.2" width="39.2" height="7.2" class="eg"/><path d="M282.5 491.2 A 9.9 11.9 0 0 1 282.5 511.0" class="ff"/><path d="M237.5 491.2 A 9.9 11.9 0 0 0 237.5 511.0" class="ff"/><path d="M282.5 491.2 A 14.4 17.3 0 0 1 282.5 511.0" class="ff"/><path d="M237.5 491.2 A 14.4 17.3 0 0 0 237.5 511.0" class="ff"/><rect x="240.4" y="577.6" width="39.2" height="7.2" class="eg"/><rect x="240.4" y="592.0" width="39.2" height="18.0" class="es"/><path d="M286.5 601.0 L342.5 601.0" fill="none" stroke="var(--w-probe)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="348.5" y="605.0" class="pn" text-anchor="start">E3 · 10–15 cm</text><rect x="240.4" y="617.2" width="39.2" height="7.2" class="eg"/><path d="M282.5 581.2 A 9.9 11.9 0 0 1 282.5 601.0" class="ff"/><path d="M237.5 581.2 A 9.9 11.9 0 0 0 237.5 601.0" class="ff"/><path d="M282.5 581.2 A 14.4 17.3 0 0 1 282.5 601.0" class="ff"/><path d="M237.5 581.2 A 14.4 17.3 0 0 0 237.5 601.0" class="ff"/><rect x="240.4" y="667.6" width="39.2" height="7.2" class="eg"/><rect x="240.4" y="682.0" width="39.2" height="18.0" class="es"/><path d="M286.5 691.0 L342.5 691.0" fill="none" stroke="var(--w-probe)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="348.5" y="695.0" class="pn" text-anchor="start">E4 · 15–20 cm · AWD line</text><rect x="240.4" y="707.2" width="39.2" height="7.2" class="eg"/><path d="M282.5 671.2 A 9.9 11.9 0 0 1 282.5 691.0" class="ff"/><path d="M237.5 671.2 A 9.9 11.9 0 0 0 237.5 691.0" class="ff"/><path d="M282.5 671.2 A 14.4 17.3 0 0 1 282.5 691.0" class="ff"/><path d="M237.5 671.2 A 14.4 17.3 0 0 0 237.5 691.0" class="ff"/><rect x="255.0" y="196.0" width="9.7" height="189.0" class="es"/><rect x="267.0" y="196.0" width="5.4" height="189.0" class="eg"/><path d="M286.5 286.0 L342.5 286.0" fill="none" stroke="var(--w-probe)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="348.5" y="290.0" class="pn" text-anchor="start">EW · water strip, −5 to +100 mm</text><rect x="255.0" y="552.4" width="10.0" height="25.2" rx="3" class="ds"/><path d="M233.5 565.0 L187.5 565.0" fill="none" stroke="var(--w-sig)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="181.5" y="569.0" class="pn" text-anchor="end" style="fill:#f4efe6">DS18B20</text><path d="M56.0 124.0 L56.0 376.0" fill="none" stroke="var(--w-gnd)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M51.0 124.0 L61.0 124.0" fill="none" stroke="var(--w-gnd)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M51.0 376.0 L61.0 376.0" fill="none" stroke="var(--w-gnd)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text class="sm" text-anchor="middle" transform="translate(48.0 250.0) rotate(-90)">140 mm above ground</text><path d="M56.0 376.0 L56.0 790.0" fill="none" stroke="var(--w-gnd)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M51.0 376.0 L61.0 376.0" fill="none" stroke="var(--w-gnd)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M51.0 790.0 L61.0 790.0" fill="none" stroke="var(--w-gnd)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text class="sm" text-anchor="middle" transform="translate(48.0 583.0) rotate(-90)">230 mm in the soil</text><text x="260.0" y="822.4" class="sm" text-anchor="middle">OD 25 · wall 1.6 · tip 20</text><text x="640.0" y="110.0" class="h2" text-anchor="start">How one electrode reads moisture</text><text x="640.0" y="140.0" class="bd" text-anchor="start">Each sense band (10 mm) sits between two GND bands (4 mm).</text><text x="640.0" y="160.0" class="bd" text-anchor="start">Its electric field fringes out through the PETG wall into the soil.</text><text x="640.0" y="180.0" class="bd" text-anchor="start">Water has a dielectric constant near 80; dry soil about 3–5.</text><text x="640.0" y="200.0" class="bd" text-anchor="start">More water → higher capacitance → ESP32 touch count changes.</text><text x="640.0" y="220.0" class="bd" text-anchor="start">Topp et al. (1980) turns permittivity ε into water content θ.</text><text x="640.0" y="240.0" class="bd" text-anchor="start">Each band reads a thin shell of soil, roughly as far out as</text><text x="640.0" y="260.0" class="bd" text-anchor="start">the electrode gap: a few millimetres. Pack soil firmly around it.</text><text x="640.0" y="300.0" class="h2" text-anchor="start">Print and build</text><text x="640.0" y="330.0" class="bd" text-anchor="start">Print as two half-shells, flat on the bed, no supports.</text><text x="640.0" y="350.0" class="bd" text-anchor="start">Lower section 230 mm, upper 140 mm, joined by a sleeve.</text><text x="640.0" y="370.0" class="bd" text-anchor="start">Copper tape on the inner face of ONE half-shell; wires up</text><text x="640.0" y="390.0" class="bd" text-anchor="start">the other half. Glue halves with epoxy, seal the tip.</text><text x="640.0" y="410.0" class="bd" text-anchor="start">Bands at −25, −75, −125, −175 mm (centres).</text><text x="640.0" y="430.0" class="bd" text-anchor="start">Black PETG is fine underground. Paint the part above</text><text x="640.0" y="450.0" class="bd" text-anchor="start">ground white so the sun does not heat the water strip.</text><text x="640.0" y="470.0" class="bd" text-anchor="start">Bed under 235 mm? Split the lower section in two.</text><text x="640.0" y="520.0" class="h2" text-anchor="start">Why it matters for AWD</text><text x="640.0" y="550.0" class="bd" text-anchor="start">The water strip reads standing water above the surface.</text><text x="640.0" y="570.0" class="bd" text-anchor="start">Bands E1–E4 keep reading after the water disappears,</text><text x="640.0" y="590.0" class="bd" text-anchor="start">so the station sees the −15 cm irrigate point that an</text><text x="640.0" y="610.0" class="bd" text-anchor="start">ultrasonic sensor above the field cannot.</text><rect x="640.0" y="650.0" width="420.0" height="48.0" rx="8" class="nt" /><text x="650.0" y="670.0" class="sm" text-anchor="start">Field nodes B2–D4 carry a mini version: EW strip + one band</text><text x="650.0" y="687.0" class="sm" text-anchor="start">(−75 mm), read with RC timing (1 MΩ) on the ESP8266.</text><style>
.dgm{font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;width:100%;height:auto}
.dgm .h1{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;font-size:22px;font-weight:700;fill:var(--d-ink)}
.dgm .h2{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--d-ink)}
.dgm .mt{font-size:14px;font-weight:700;fill:var(--d-ink)}
.dgm .ms{font-size:12px;fill:var(--d-muted)}
.dgm .pn{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;fill:var(--d-ink)}
.dgm .nl{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;font-weight:600}
.dgm .sm{font-size:11.5px;fill:var(--d-muted)}
.dgm .bd{font-size:13px;fill:var(--d-ink)}
.dgm .lbl{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600;fill:var(--d-ink)}
.dgm .tiny{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px;fill:var(--d-ink)}
.dgm .pl{font-size:12px;font-weight:700;fill:var(--d-ink)}
.dgm .bx{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.4}
.dgm .hl{stroke:var(--w-probe);stroke-width:2.2}
.dgm .nt{fill:var(--d-note);stroke:var(--d-line)}
.dgm .rs{fill:var(--d-box);stroke:var(--d-ink);stroke-width:1.4}
.dgm .pin{fill:var(--d-box);stroke:var(--d-ink);stroke-width:1.4}
.dgm .pcb{fill:var(--d-pcb);stroke:var(--d-line)}
.dgm .hole{fill:var(--d-hole)}
.dgm .esp{fill:var(--d-esp);stroke:var(--d-line);opacity:.9}
.dgm .pbx{fill:var(--d-box);stroke:var(--d-ink);stroke-width:1.2;opacity:.92}
.dgm .hdr{fill:#222;stroke:#555}
.dgm .hdr2{fill:var(--w-probe);opacity:.8}
.dgm .soil{fill:var(--d-soil)}
.dgm .water{fill:var(--d-water)}
.dgm .tube{fill:var(--d-tube);stroke:var(--d-ink);stroke-width:1.2}
.dgm .cap{fill:var(--d-ink);opacity:.8}
.dgm .es{fill:#c8742c}
.dgm .eg{fill:#8a5a2b}
.dgm .ds{fill:#333}
.dgm .ff{fill:none;stroke:var(--w-probe);stroke-width:1;stroke-dasharray:2 2;opacity:.8}
</style></svg>